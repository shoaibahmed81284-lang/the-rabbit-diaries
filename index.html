<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day! 🐰</title>
    <style>
        body {
            background-color: #ffe6ea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
        }
        h1 { color: #ff4d6d; font-size: 24px; }
        p { color: #555; font-size: 16px; line-height: 1.5; }
        .btn-container { margin-top: 25px; position: relative; height: 50px; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; margin-right: 10px; }
        #noBtn { background-color: #ccc; color: #333; position: absolute; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1>Happy Friendship Day! 🐰✨</h1>
        <p>Quick question for my favorite person...</p>
        <p><b>Are we Best Friends Forever?</b> 💖</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">YES! 🥳</button>
            <button id="noBtn" onmouseover="moveBtn()" onclick="moveBtn()">NO 😜</button>
        </div>
    </div>

    <script>
        function moveBtn() {
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 50);
            let btn = document.getElementById('noBtn');
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('mainCard').innerHTML = `
                <h1>Yayyy! 🎉💖</h1>
                <p>I knew it! You're stuck with me forever. 🙈✨</p>
                <p>Happy Friendship Day to the best person ever!</p>
            `;
        }
    </script>
</body>
</html>
